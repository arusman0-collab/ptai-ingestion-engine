kind = "web"
previewPath = "/"
title = "PTAI Ingestion Engine"
description = "A focused ingestion operations workspace for monitoring sources, reviewing incoming records, and understanding pipeline health at a glance."
version = "1.0.0"
id = "artifacts/ptai-ingestion-engine"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23667

[services.development]
run = "pnpm --filter @workspace/ptai-ingestion-engine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ptai-ingestion-engine", "run", "build" ]
serve = "static"
publicDir = "artifacts/ptai-ingestion-engine/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23667"
BASE_PATH = "/"
